[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "local-voice-ai-pipeline"
version = "0.1.0"
description = "Private speech-to-text, local LLM, and text-to-speech orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[project.scripts]
local-voice = "voice_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
